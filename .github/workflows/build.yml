name: Android Build

on:
  push:
    branches: ["*"]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Stamp version
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        run: |
          COUNT=$(git rev-list --count HEAD)
          TAG="v1.0.$COUNT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          sed -i "s/^version:.*/version: 1.0.$COUNT+$COUNT/" pubspec.yaml
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add pubspec.yaml
          if git diff --cached --quiet; then
            echo "pubspec already at $TAG"
          else
            git commit -m "chore: stamp version $TAG"
            git push origin main
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up release signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "No release keystore secret configured, skipping release signing setup"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/libre_read_keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/libre_read_keystore.jks
          EOF

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: libre-read-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create tag on main
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        run: |
          TAG="${TAG:-v1.0.$(git rev-list --count HEAD)}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if git tag -l | grep -q "^$TAG$"; then
            echo "Tag $TAG already exists"
          else
            git config user.email "actions@github.com"
            git config user.name "github-actions"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
          fi

      - name: Generate changelog
        if: (github.ref_type == 'branch' && github.ref_name == 'main') || startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        if: (github.ref_type == 'branch' && github.ref_name == 'main') || startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${TAG:-${GITHUB_REF_NAME}}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk --target "$GITHUB_SHA" --notes-file CHANGELOG.md
          fi