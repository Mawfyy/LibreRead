name: libre_read
description: App to read EPUB and text documents.
publish_to: 'none'
version: 1.0.14+14

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_epub_viewer: ^2.0.0
  epub_pro: ^5.6.0
  image: ^4.5.0
  file_picker: ^12.0.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  intl: ^0.20.0
  pdfx: ^2.9.2
  http: ^1.6.0
  package_info_plus: ^10.2.1
  open_filex: ^4.7.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
