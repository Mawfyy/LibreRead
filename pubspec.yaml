name: lector_documentos
description: Aplicacion para leer PDF, Word y EPUB en Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  pdfrx: ^2.4.7
  docx_file_viewer: ^1.0.3
  flutter_epub_viewer: ^2.0.0
  file_picker: ^12.0.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
