name: lector_documentos
description: Aplicación para leer PDF, Word y EPUB en Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # Visores de documentos
  pdfrx: ^2.4.7
  docx_file_viewer: ^1.0.3
  flutter_epub_viewer: ^2.0.0

  # Selector de archivos
  file_picker: ^12.0.0

  # Almacenamiento local
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  shared_preferences: ^2.3.0

  # Utilidades
  path_provider: ^2.1.0
  path: ^1.9.0

  # UI
  flutter_staggered_animations: ^1.1.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_ce_generator: ^1.8.0
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
